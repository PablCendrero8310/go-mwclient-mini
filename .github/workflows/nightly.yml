name: Nightly Release

on:
  push:
    branches:
      - develop

permissions:
  contents: write

concurrency:
  group: nightly-release
  cancel-in-progress: true

jobs:
  nightly:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Tests
        run: go test ./...

      - name: Generate version
        id: version
        run: |
          BASE=$(git describe --tags --abbrev=0 \
            --match 'v[0-9]*' 2>/dev/null || echo "v0.0.0")

          BASE=${BASE#v}

          VERSION="v${BASE}-nightly.$(date -u +'%Y%m%d.%H%M%S')"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create version tag
        run: |
          git tag "${{ steps.version.outputs.version }}" "$GITHUB_SHA"
          git push origin "${{ steps.version.outputs.version }}"

      - name: Publish versioned prerelease
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: ${{ steps.version.outputs.version }}
          prerelease: true
          make_latest: false
          generate_release_notes: true

      - name: Update nightly tag
        run: |
          git tag -f nightly "$GITHUB_SHA"
          git push origin refs/tags/nightly --force

      - name: Update nightly release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: nightly
          name: Nightly
          prerelease: true
          make_latest: false
          body: |
            Automated nightly release.

            Version: ${{ steps.version.outputs.version }}
            Commit: ${{ github.sha }}
            Branch: main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
