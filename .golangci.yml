version: "2"
linters:
  enable:
    - errcheck
    - govet
    - staticcheck
    - unused
    - ineffassign
    - misspell
    - unconvert
    - gocritic
  settings:
    errcheck:
      check-type-assertions: true
    govet:
      enable:
        - shadow
formatters:
  enable:
    - gofmt
    - goimports   
